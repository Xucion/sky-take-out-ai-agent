server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  ai-internal:
    # 两个真实密钥必须由部署环境注入；留空时内部AI接口安全地返回503，而不是跳过认证
    service-secret-key: dev-service-key-please-change-2026-123456
    user-context-secret-key: dev-user-context-key-change-2026-654321
    # 服务身份和用户上下文分两个请求头传递，便于分别验证用途
    service-token-name: Authorization
    user-context-token-name: X-AI-User-Context
    service-subject: sky-ai-service
    audience: sky-server
    # 服务令牌最长10分钟，用户上下文最长2分钟，减少内部令牌泄露后的可利用窗口
    service-token-max-ttl-millis: 600000
    user-context-max-ttl-millis: 120000
    allowed-clock-skew-millis: 30000
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 72000000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: itheima
    user-ttl: 72000000
    user-token-name: authentication
  minio:
    endpoint: ${sky.minio.endpoint}
    access-key: ${sky.minio.access-key}
    secret-key: ${sky.minio.secret-key}
    bucket-name: ${sky.minio.bucket-name}
  shop:
    address: ${sky.shop.address}
  baidu:
    ak: ${sky.baidu.ak}
