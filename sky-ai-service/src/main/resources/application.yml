server:
  port: ${AI_SERVICE_PORT:8081}

spring:
  profiles:
    # 默认离线 Fake；真实模型必须显式设置 SPRING_PROFILES_ACTIVE=qwen。
    active: ${SPRING_PROFILES_ACTIVE:fake}
  application:
    name: sky-ai-service
  datasource:
    url: ${AI_DB_URL:jdbc:mysql://localhost:3306/sky_take_out?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AI_DB_USERNAME:root}
    # 不提供仓库内默认密码；开发、测试和生产环境都必须从外部注入。
    password: ${AI_DB_PASSWORD:2628}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${AI_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${AI_DB_MIN_IDLE:1}
      connection-timeout: ${AI_DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # sky_take_out 是已有业务库。首次由 Flyway 接管时临时开启 baseline-on-migrate，
    # 以版本 0 建立基线后继续执行 V1；完成接管后应关闭该开关。
    baseline-version: 0
    baseline-on-migrate: ${AI_FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
  data:
    redis:
      host: ${AI_REDIS_HOST:localhost}
      port: ${AI_REDIS_PORT:6379}
      password: ${AI_REDIS_PASSWORD:}
      database: ${AI_REDIS_DATABASE:1}
      connect-timeout: ${AI_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${AI_REDIS_TIMEOUT:1s}
  ai:
    tools:
      # 业务工具失败必须向上抛出，不能把内部异常文本交给模型自由改写。
      throw-exception-on-error: true
    # 默认关闭真实模型自动配置，本地无需 API Key 即可运行 Fake Provider。
    model:
      chat: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  order:
    # 缺少订单 ID 的澄清状态是短期上下文，查询成功后会立即清除。
    context-ttl: ${AI_ORDER_CONTEXT_TTL:30m}
  recommendation:
    # 会话推荐偏好是短期上下文，不会自动转成长期用户画像。
    context-ttl: ${AI_RECOMMENDATION_CONTEXT_TTL:30m}
  ai:
    # fake 是安全默认值；只有显式启用 qwen profile 才会创建真实模型客户端。
    provider: ${AI_PROVIDER:fake}
    max-input-chars: ${AI_MAX_INPUT_CHARS:2000}
  sky-server:
    # 这里只指向业务服务门面，不能改成数据库、Redis 或任意用户提供的 URL。
    base-url: ${SKY_SERVER_BASE_URL:http://localhost:8080}
    connect-timeout: ${SKY_SERVER_CONNECT_TIMEOUT:2s}
    read-timeout: ${SKY_SERVER_READ_TIMEOUT:5s}
  auth:
    # 空值会让需要业务工具的请求快速失败，但不妨碍 Fake 模式服务启动和健康检查。
    user-jwt-secret: itheima
    # 以下两把内部密钥需要与 sky-server 配置一致，但彼此必须不同。
    service-jwt-secret: dev-service-key-please-change-2026-123456
    user-context-jwt-secret: dev-user-context-key-change-2026-654321
    service-token-ttl: ${SKY_AI_SERVICE_TOKEN_TTL:5m}
    user-context-token-ttl: ${SKY_AI_USER_CONTEXT_TOKEN_TTL:2m}
