[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-ai-service-py"
version = "0.1.0"
description = "Sky customer service with FastAPI, LangChain and LangGraph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "langchain>=1.0,<2", "langgraph>=1.0,<2", "langchain-openai>=1.0,<2",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2",
  "PyJWT>=2.10,<3", "httpx>=0.28,<1", "redis>=6,<8", "alembic>=1.15,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "fakeredis>=2.28,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["sky_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
